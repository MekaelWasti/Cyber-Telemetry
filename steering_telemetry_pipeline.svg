<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0.5 L7,3.5 L0,6.5 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0.5 L7,3.5 L0,6.5 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0.5 L7,3.5 L0,6.5 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0.5 L7,3.5 L0,6.5 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#f8fafc" rx="12"/>

  <text x="450" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.3">Steering Telemetry Triage with Self-Supervised Graph Geometry</text>
  <text x="450" y="54" text-anchor="middle" font-size="10.5" fill="#64748b">Process telemetry  →  heterogeneous graph  →  session embeddings  →  analyst-steered retrieval</text>

  <!-- Stage 1: Raw Telemetry -->
  <rect x="36" y="80" width="148" height="96" rx="9" fill="url(#blueGrad)" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="110" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Raw Telemetry</text>
  <line x1="60" y1="113" x2="160" y2="113" stroke="#bfdbfe" stroke-width="1"/>
  <text x="110" y="128" text-anchor="middle" font-size="9.5" fill="#1e3a8a">100k processes</text>
  <text x="110" y="143" text-anchor="middle" font-size="9.5" fill="#1e3a8a">ACME4 telemetry</text>
  <text x="110" y="158" text-anchor="middle" font-size="9.5" fill="#1e3a8a">31 red-team rows</text>

  <line x1="186" y1="128" x2="216" y2="128" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 2: Session Extraction -->
  <rect x="218" y="80" width="148" height="96" rx="9" fill="url(#blueGrad)" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="292" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Session Extraction</text>
  <line x1="242" y1="113" x2="342" y2="113" stroke="#bfdbfe" stroke-width="1"/>
  <text x="292" y="128" text-anchor="middle" font-size="9.5" fill="#1e3a8a">Gap split: 5 min</text>
  <text x="292" y="143" text-anchor="middle" font-size="9.5" fill="#1e3a8a">Max duration: 30 min</text>
  <text x="292" y="158" text-anchor="middle" font-size="9.5" fill="#1e3a8a">3,131 sessions · 19 malicious</text>

  <line x1="368" y1="128" x2="398" y2="128" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 3: Hetero Graph -->
  <rect x="400" y="80" width="148" height="96" rx="9" fill="url(#blueGrad)" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="474" y="101" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Heterogeneous</text>
  <text x="474" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Graph</text>
  <line x1="424" y1="120" x2="524" y2="120" stroke="#bfdbfe" stroke-width="1"/>
  <text x="474" y="134" text-anchor="middle" font-size="9.5" fill="#1e3a8a">parent_child · same_user</text>
  <text x="474" y="149" text-anchor="middle" font-size="9.5" fill="#1e3a8a">touches · touched_by</text>
  <text x="474" y="164" text-anchor="middle" font-size="9.5" fill="#1e3a8a">same_host removed</text>

  <line x1="550" y1="128" x2="580" y2="128" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 4: HeteroSAGE -->
  <rect x="582" y="68" width="148" height="120" rx="9" fill="url(#tealGrad)" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="656" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">HeteroSAGE</text>
  <text x="656" y="107" text-anchor="middle" font-size="9.5" fill="#064e3b">(self-supervised)</text>
  <line x1="606" y1="115" x2="706" y2="115" stroke="#a7f3d0" stroke-width="1"/>
  <text x="656" y="130" text-anchor="middle" font-size="9.5" fill="#064e3b">Link prediction</text>
  <text x="656" y="145" text-anchor="middle" font-size="9.5" fill="#064e3b">2-layer · hidden=48</text>
  <text x="656" y="160" text-anchor="middle" font-size="9.5" fill="#064e3b">Per-type SAGEConv</text>
  <text x="656" y="175" text-anchor="middle" font-size="9.5" fill="#064e3b">aggr=sum → merge</text>

  <line x1="732" y1="128" x2="762" y2="128" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 5: Session Embeddings -->
  <rect x="764" y="80" width="112" height="96" rx="9" fill="url(#tealGrad)" stroke="#6ee7b7" stroke-width="1.4"/>
  <text x="820" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Session</text>
  <text x="820" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Embeddings</text>
  <line x1="784" y1="124" x2="864" y2="124" stroke="#a7f3d0" stroke-width="1"/>
  <text x="820" y="139" text-anchor="middle" font-size="9.5" fill="#064e3b">Mean pool processes</text>
  <text x="820" y="154" text-anchor="middle" font-size="9.5" fill="#064e3b">48-dim · ℓ2 norm</text>
  <text x="820" y="169" text-anchor="middle" font-size="9.5" fill="#064e3b">3-seed consensus</text>

  <text x="450" y="218" text-anchor="middle" font-size="9" fill="#94a3b8" letter-spacing="1.5">─────────────────────────────  ANALYST WORKFLOW  ─────────────────────────────</text>

  <!-- Branch A: Guided Discovery -->
  <rect x="80" y="236" width="320" height="110" rx="9" fill="url(#orangeGrad)" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="240" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">① Guided Discovery</text>
  <line x1="104" y1="270" x2="376" y2="270" stroke="#fde68a" stroke-width="1"/>
  <rect x="96" y="278" width="136" height="56" rx="6" fill="white" fill-opacity="0.55" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="164" y="296" text-anchor="middle" font-size="9.5" font-weight="600" fill="#78350f">Anomaly Scoring</text>
  <text x="164" y="311" text-anchor="middle" font-size="9" fill="#92400e">kNN dist in feature space</text>
  <text x="164" y="325" text-anchor="middle" font-size="9" fill="#92400e">percentile rank</text>
  <rect x="248" y="278" width="136" height="56" rx="6" fill="white" fill-opacity="0.55" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="316" y="296" text-anchor="middle" font-size="9.5" font-weight="600" fill="#78350f">Stable Region Ranking</text>
  <text x="316" y="311" text-anchor="middle" font-size="9" fill="#92400e">k=40 · ≥2/3 seed agree</text>
  <text x="316" y="325" text-anchor="middle" font-size="9" fill="#92400e">top-3 evidence score</text>
  <line x1="233" y1="306" x2="246" y2="306" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrOrange)"/>
  <text x="240" y="360" text-anchor="middle" font-size="9" fill="#78350f">26 reviews → first confirmed anchor</text>

  <!-- Branch B: Cosine Steering -->
  <rect x="500" y="236" width="320" height="110" rx="9" fill="url(#purpleGrad)" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="660" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">② Cosine Steering</text>
  <line x1="524" y1="270" x2="796" y2="270" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="516" y="278" width="136" height="56" rx="6" fill="white" fill-opacity="0.55" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="584" y="296" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4c1d95">Anchor Query</text>
  <text x="584" y="311" text-anchor="middle" font-size="9" fill="#3b0764">1 confirmed session</text>
  <text x="584" y="325" text-anchor="middle" font-size="9" fill="#3b0764">unit-norm embedding</text>
  <rect x="668" y="278" width="136" height="56" rx="6" fill="white" fill-opacity="0.55" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="736" y="296" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4c1d95">Ranked Retrieval</text>
  <text x="736" y="311" text-anchor="middle" font-size="9" fill="#3b0764">cosine sim · all sessions</text>
  <text x="736" y="325" text-anchor="middle" font-size="9" fill="#3b0764">top-k review queue</text>
  <line x1="653" y1="306" x2="666" y2="306" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrPurple)"/>
  <text x="660" y="360" text-anchor="middle" font-size="9" fill="#4c1d95">AP 0.140 · recall@100 0.467 · p &lt; 0.0005</text>

  <!-- Connector between branches -->
  <line x1="400" y1="291" x2="498" y2="291" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="449" y="284" text-anchor="middle" font-size="8.5" fill="#64748b">confirms anchor</text>

  <text x="450" y="400" text-anchor="middle" font-size="9" fill="#94a3b8" letter-spacing="1.5">───────────────────────────────────  EVALUATION  ───────────────────────────────────</text>

  <!-- Eval boxes -->
  <rect x="60" y="414" width="172" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="146" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Separation Gap</text>
  <line x1="80" y1="442" x2="212" y2="442" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="146" y="458" text-anchor="middle" font-size="9" fill="#475569">kNN malicious-neighbor rate</text>
  <text x="146" y="472" text-anchor="middle" font-size="9" fill="#475569">real 0.195 vs shuffle 0.052</text>
  <text x="146" y="486" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">graph topology is signal</text>

  <rect x="252" y="414" width="172" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="338" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Retrieval Quality</text>
  <line x1="272" y1="442" x2="404" y2="442" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="338" y="458" text-anchor="middle" font-size="9" fill="#475569">AP · recall@25/50/100</text>
  <text x="338" y="472" text-anchor="middle" font-size="9" fill="#475569">19-anchor leave-one-out</text>
  <text x="338" y="486" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">avg over 3 GNN seeds</text>

  <rect x="444" y="414" width="172" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="530" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Controls</text>
  <line x1="464" y1="442" x2="596" y2="442" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="530" y="458" text-anchor="middle" font-size="9" fill="#475569">Shuffled-edge SAGE</text>
  <text x="530" y="472" text-anchor="middle" font-size="9" fill="#475569">Node stats baseline</text>
  <text x="530" y="486" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Wilcoxon paired one-sided</text>

  <rect x="636" y="414" width="172" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="722" y="436" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">End-to-End</text>
  <line x1="656" y1="442" x2="788" y2="442" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="722" y="458" text-anchor="middle" font-size="9" fill="#475569">26 discovery reviews</text>
  <text x="722" y="472" text-anchor="middle" font-size="9" fill="#475569">+ 100 steering reviews</text>
  <text x="722" y="486" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">11 / 19 malicious found</text>

  <!-- Arrows into eval -->
  <line x1="240" y1="370" x2="240" y2="412" stroke="#f59e0b" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrOrange)"/>
  <line x1="530" y1="348" x2="530" y2="412" stroke="#a78bfa" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arrPurple)"/>
  <line x1="820" y1="178" x2="820" y2="390" stroke="#6ee7b7" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="820" y1="390" x2="722" y2="412" stroke="#6ee7b7" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="60" y="518" width="780" height="34" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="76" y="529" width="12" height="12" rx="2" fill="url(#blueGrad)" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="94" y="540" font-size="9" fill="#475569">Data &amp; Graph</text>
  <rect x="178" y="529" width="12" height="12" rx="2" fill="url(#tealGrad)" stroke="#6ee7b7" stroke-width="0.8"/>
  <text x="196" y="540" font-size="9" fill="#475569">GNN Learning</text>
  <rect x="290" y="529" width="12" height="12" rx="2" fill="url(#orangeGrad)" stroke="#fcd34d" stroke-width="0.8"/>
  <text x="308" y="540" font-size="9" fill="#475569">Guided Discovery</text>
  <rect x="416" y="529" width="12" height="12" rx="2" fill="url(#purpleGrad)" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="434" y="540" font-size="9" fill="#475569">Cosine Steering</text>
  <rect x="540" y="529" width="12" height="12" rx="2" fill="white" stroke="#e2e8f0" stroke-width="0.8"/>
  <text x="558" y="540" font-size="9" fill="#475569">Evaluation</text>
  <line x1="628" y1="535" x2="648" y2="535" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="656" y="540" font-size="9" fill="#475569">Information flow (no label leakage)</text>

  <text x="450" y="584" text-anchor="middle" font-size="8.5" fill="#94a3b8">Labels used only for final evaluation. No label information flows into graph construction, GNN training, session embedding, or retrieval ranking.</text>
  <text x="450" y="598" text-anchor="middle" font-size="8.5" fill="#94a3b8">Wilcoxon: p &lt; 0.0005 vs. shuffled-edge control and node-stats baseline across all 19 anchors · 3 seeds.</text>
</svg>
